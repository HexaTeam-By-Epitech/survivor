services:
  server:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.server
    container_name: survivor-server
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
    ports:
      - "4242:4242"
    networks:
      - survivor-app
    restart: "no"

  client:
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.client
    container_name: survivor-client
    ports:
      - "4240:4240"
    networks:
      - survivor-app
    restart: "no"
  
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - server
      - client
    networks:
      - survivor-app


networks:
  survivor-app:
    driver: bridge
