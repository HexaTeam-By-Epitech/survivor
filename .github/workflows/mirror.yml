
name: survivor

on:
  push:
    branches-ignore:
      - 'ga-ignore-*'
  pull_request:
    branches-ignore:
      - 'ga-ignore-*'

jobs:
  check_repo:
    name: "Checks if the repository is clean and void of any unwanted files (temp files, binary files, etc.)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: check_repo
        run: |
          UNWANTED_FILES=$(find . -type f -not -path "./git/*" -wholename "*tmp/*" -or -name "*~" -or -name "*.o" -or -name "*.so" -or -name "*.gcno" -or -name "*.gcda" -or -name "*#" -or -name "#*" -or -name "*.gcov")
          for FILES in $UNWANTED_FILES; do
            echo "::error file=${FILES#./},title=Unwanted file detected::${FILES#./}"
          done
          if [[ -n $UNWANTED_FILES ]]
          then
            exit 1
          else
            echo No unwanted files detected
          fi

  check_program_compilation:
    needs: [check_repo]
    name: "Checks if npm start works for backend and frontend"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start backend
        run: |
          if [ -f backend/package.json ]; then
            cd backend
            npm install
            npm run build
            npm start &
            BACKEND_PID=$!
            sleep 10
            if ps -p $BACKEND_PID > /dev/null; then
              echo "Backend started successfully"
            else
              echo "Error: Backend failed to start"
              exit 1
            fi
            cd ..
          else
            echo "No backend directory or package.json found, skipping backend startup."
          fi
      - name: Build and start frontend
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm install
            npm run build
            npm start &
            FRONTEND_PID=$!
            sleep 10
            if ps -p $FRONTEND_PID > /dev/null; then
              echo "Frontend started successfully"
            else
              echo "Error: Frontend failed to start"
              exit 1
            fi
            cd ..
          else
            echo "No frontend directory or package.json found, skipping frontend startup."
          fi
        timeout-minutes: 5

  run_tests:
    needs: [check_program_compilation]
    name: "Runs tests with npm test"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Run backend tests
        run: |
          if [ -f backend/package.json ]; then
            cd backend
            npm install
            npm test
            cd ..
          else
            echo "No backend directory or package.json found, skipping backend tests."
          fi
      - name: Run frontend tests
        run: |
          if [ -f frontend/package.json ]; then
            cd frontend
            npm install
            npm test
            cd ..
          else
            echo "No frontend directory or package.json found, skipping frontend tests."
          fi
        timeout-minutes: 5

  push_to_mirror:
    needs: [run_tests, check_repo, check_program_compilation]
    if: ${{ github.event_name == 'push' && github.actor != 'github-actions[bot]' && startsWith(github.repository, 'HexaTeam-By-Epitech') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ vars.MIRROR_URL }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
